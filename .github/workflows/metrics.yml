name: Metrics
on:
  # Update otomatis setiap jam 06:00 pagi WIB
  schedule: [{cron: "0 23 * * *"}]
  # Tombol manual "Run workflow"
  workflow_dispatch:
  # Update saat ada push ke repo
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # =========================================================
          # 1. TAMPILAN LEBAR (WAJIB ADA INI AGAR 2 KOLOM)
          # =========================================================
          config_display: large
          user: Padlibzz
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Jakarta

          # =========================================================
          # 2. SOLUSI ERROR "UNEXPECTED ERROR"
          # =========================================================
          # Kita matikan 'charts' sementara agar error hilang.
          # Aktifkan lagi nanti (ubah ke 'yes') jika sudah rajin coding.
          plugin_habits: yes
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: no      # <--- Ubah ke 'no' agar tidak error merah
          plugin_habits_trim: yes

          # =========================================================
          # 3. PENGATURAN LAIN (BAHASA & KALENDER)
          # =========================================================
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          plugin_languages_details: lines, percentage

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_topics: yes
          plugin_topics_sort: stars
          plugin_topics_mode: icons
          plugin_topics_limit: 15
