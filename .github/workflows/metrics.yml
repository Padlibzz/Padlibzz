name: Metrics
on:
  # Jadwal update otomatis jam 00:00 WIB
  schedule: [{cron: "0 17 * * *"}]
  # Trigger manual
  workflow_dispatch:
  # Trigger saat ada push
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # --- BAGIAN 1: PENGATURAN TAMPILAN LEBAR ---
          user: Padlibzz
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Jakarta
          config_display: large    # <--- INI KUNCI AGAR TAMPILAN MENJADI 2 KOLOM (LEBAR)

          # --- BAGIAN 2: PERBAIKAN HABITS (Unexpected Error Fix) ---
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30        # Saya naikkan ke 30 hari agar lebih banyak data terbaca
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes       # <--- PENTING: Mencegah error jika data grafik kosong

          # --- BAGIAN 3: BAHASA PEMROGRAMAN (Detail) ---
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css
          plugin_languages_details: lines, percentage
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          plugin_languages_limit: 8

          # --- BAGIAN 4: KALENDER 3D ---
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # --- BAGIAN 5: IKON/TOPICS (Agar muncul logo di bawah) ---
          plugin_topics: yes
          plugin_topics_sort: stars
          plugin_topics_mode: icons     # Menampilkan topic sebagai ikon (seperti contoh target)
          plugin_topics_limit: 15
